[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "task8"
version = "0.1.0"
description = "Just description"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Ivan Freeze", email = "ivan@example.com"},
]
keywords = ["fastapi", "sqlalchemy", "postgres", "mysql"]

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "SQLAlchemy>=2.0.0",
    "pydantic-settings>=2.2.0",
]

[project.optional-dependencies]
postgres = [
    "psycopg2-binary>=2.9.9",
]
mysql = [
    "pymysql>=1.1.0",
    "cryptography>=42.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[tool.ruff]
line-length = 88
select = ["E", "F", "I"]
fix = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]